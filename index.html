<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brandon Nguyen</title>
<meta name="description" content="Architecture and design portfolio of Brandon Nguyen, Rice University School of Architecture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: a drawing sheet. Left-aligned masthead, 12-column grid, text set in an offset column like a monograph, each project opened by a title block. */
:root {
  --paper: #f6f6f3;      /* bristol board */
  --ink: #1c1c1a;        /* graphite */
  --muted: #6d6d68;
  --rule: #d6d6d0;
  --plate: #ffffff;      /* mat behind drawings */
  --accent: #d9622b;     /* the orange inside the Geometric Abstraction model */
  --font: "Jost", "Futura", "Century Gothic", "Avenir Next", system-ui, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.75rem;
  --step-3: clamp(2.25rem, 5vw, 3.75rem);
  --gutter: clamp(16px, 4vw, 56px);
  --max: 1440px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151514; --ink: #ebebe6; --muted: #9b9b95; --rule: #2f2f2c; --plate: #1f1f1d; --accent: #ef7a41;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151514; --ink: #ebebe6; --muted: #9b9b95; --rule: #2f2f2c; --plate: #1f1f1d; --accent: #ef7a41;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: var(--step-0); font-weight: 400; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
img { display: block; max-width: 100%; height: auto; }
h1, h2, h3 { font-weight: 300; line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }

.wrap {
  max-width: var(--max); margin: 0 auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: clamp(12px, 2vw, 28px); }

/* Masthead */
.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
.mast .wrap { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-block: 18px; }
.wordmark { font-size: var(--step-0); font-weight: 400; letter-spacing: 0.24em; text-transform: uppercase; text-decoration: none; }
.mast nav { display: flex; flex-wrap: wrap; gap: 4px 28px; }
.mast nav a { text-decoration: none; color: var(--muted); }
.mast nav a:hover, .mast nav a[aria-current="true"] { color: var(--ink); }

/* Home hero */
.hero { padding-block: clamp(40px, 7vw, 96px) clamp(48px, 8vw, 112px); align-items: end; row-gap: 40px; }
.hero-text { grid-column: 1 / span 5; display: grid; gap: 28px; align-self: end; }
.hero-name { font-size: var(--step-3); letter-spacing: 0.08em; text-transform: uppercase; }
.hero-lede { font-size: var(--step-1); font-weight: 300; max-width: 34ch; line-height: 1.45; }
.hero-meta { color: var(--muted); font-size: var(--step--1); display: grid; gap: 2px; }
.hero-figure { grid-column: 7 / -1; margin: 0; }
.hero-figure img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: 60% 80%; background: #000; }
.hero-figure figcaption { margin-top: 10px; font-size: var(--step--1); color: var(--muted); }

/* Section headers */
.section { padding-block: clamp(56px, 8vw, 104px); border-top: 1px solid var(--rule); }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: clamp(32px, 5vw, 56px); }
.section-head h2 { font-size: var(--step-2); letter-spacing: 0.06em; text-transform: uppercase; }
.section-head p { color: var(--muted); font-size: var(--step--1); }

/* Project index */
/* Two staggered columns: odd-numbered projects on the left, even on the right, each stacking up to fill the space. */
/* The middle gap equals the outer margin (inset + page gutter), so the space around and between the columns matches. */
.projects {
  --inset: clamp(0px, 6vw, 88px);
  grid-template-columns: var(--inset) minmax(0, 1fr) calc(var(--inset) + var(--gutter) + max(0px, (100vw - var(--max)) / 2)) minmax(0, 1fr) var(--inset);
  column-gap: 0; align-items: start;
}
.proj-col { display: flex; flex-direction: column; gap: clamp(48px, 7vw, 88px); min-width: 0; }
.proj-col.left { grid-column: 2; }
.proj-col.right { grid-column: 4; margin-top: clamp(32px, 8vw, 120px); }
.card { text-decoration: none; display: grid; gap: 14px; align-content: start; }
.card .frame { overflow: hidden; background: var(--plate); }
.card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; transition: transform 0.6s ease; }
.card.portrait img { aspect-ratio: 4 / 5; }
.card:hover img { transform: scale(1.025); }
.card-title { display: flex; gap: 14px; align-items: baseline; }
.card-num { font-size: var(--step--1); color: var(--muted); font-variant-numeric: tabular-nums; }
.card-name { font-size: var(--step-1); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 400; }
.card:hover .card-name { color: var(--accent); }
.card-sub { color: var(--muted); font-size: var(--step--1); padding-left: calc(1.4em + 14px); }

/* Other work */
.other { row-gap: 40px; }
.other-item { grid-column: span 3; display: grid; gap: 12px; align-content: start; }
.placeholder {
  aspect-ratio: 4 / 5; border: 1px dashed var(--rule); display: grid; place-items: center;
  color: var(--muted); font-size: var(--step--1); text-align: center; padding: 16px;
  background:
    linear-gradient(to right, var(--rule) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(to bottom, var(--rule) 1px, transparent 1px) 0 0 / 24px 24px;
  background-color: var(--paper);
}
.placeholder span { background: var(--paper); padding: 4px 10px; }
.other-item.linked { text-decoration: none; }
.other-item .frame { overflow: hidden; background: var(--plate); }
.other-item .frame img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: top; transition: transform 0.6s ease; }
.other-item.linked:hover .frame img { transform: scale(1.025); }
.other-item.linked:hover h3 { color: var(--accent); }
.other-item h3 { font-size: var(--step-1); font-weight: 400; letter-spacing: 0.04em; }
.other-item p { color: var(--muted); font-size: var(--step--1); max-width: 34ch; }

/* About */
.about { row-gap: 48px; }
.bio { grid-column: 1 / span 6; display: grid; gap: 20px; align-content: start; }
.bio p { font-size: var(--step-1); font-weight: 300; line-height: 1.5; max-width: 36ch; }
.contact { display: grid; gap: 10px; margin-top: 12px; font-size: var(--step-0); }
.contact-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.contact-row a { overflow-wrap: anywhere; }
.contact-label { color: var(--muted); font-size: var(--step--1); width: 5.5em; }
.downloads { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.dl { display: inline-flex; align-items: baseline; gap: 10px; padding: 10px 16px; border: 1px solid var(--ink); text-decoration: none; }
.dl span { color: var(--muted); font-size: var(--step--1); }
.dl:hover { background: var(--ink); color: var(--paper); }
.dl:hover span { color: inherit; }
.copy-btn {
  font: inherit; font-size: var(--step--1); color: var(--muted); background: none;
  border: 1px solid var(--rule); padding: 2px 10px; cursor: pointer;
}
.copy-btn:hover { color: var(--ink); border-color: var(--ink); }
.cv { grid-column: 8 / -1; display: grid; gap: 36px; }
.cv h3 { font-size: var(--step--1); font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid var(--rule); margin-bottom: 14px; }
.cv dl { margin: 0; display: grid; gap: 14px; }
.cv-row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 16px; }
.cv dt { color: var(--muted); font-size: var(--step--1); font-variant-numeric: tabular-nums; padding-top: 2px; }
.cv dd { margin: 0; }
.cv dd small { display: block; color: var(--muted); font-size: var(--step--1); }
.cv ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cv ul li small { color: var(--muted); font-size: var(--step--1); }

footer { border-top: 1px solid var(--rule); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding-block: 28px; color: var(--muted); font-size: var(--step--1); }

/* Project page */
.project { padding-block: clamp(32px, 5vw, 64px) clamp(56px, 8vw, 104px); }
.back { display: inline-block; margin-bottom: clamp(28px, 4vw, 48px); color: var(--muted); text-decoration: none; font-size: var(--step--1); }
.back:hover { color: var(--ink); }
.p-head { row-gap: 32px; margin-bottom: clamp(40px, 6vw, 72px); align-items: end; }
.p-title { grid-column: 1 / span 7; display: grid; gap: 18px; }
.p-num { font-size: var(--step-1); color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 300; }
.p-title h1 { font-size: var(--step-3); letter-spacing: 0.06em; text-transform: uppercase; }
.p-intro { font-size: var(--step-1); font-weight: 300; line-height: 1.5; max-width: 40ch; }

.titleblock { grid-column: 9 / -1; border: 1px solid var(--ink); background: var(--ink); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; font-size: var(--step--1); align-self: end; }
.tb-cell { padding: 8px 12px 10px; background: var(--paper); min-width: 0; }
.tb-cell.wide { grid-column: 1 / -1; }
.tb-label { display: block; font-size: 0.6875rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.tb-value { overflow-wrap: anywhere; }

.blocks { display: grid; gap: clamp(28px, 4vw, 56px); }
.b-text { grid-column: 5 / span 6; display: grid; gap: 1em; max-width: 62ch; }
.b-text p { font-size: 1.0625rem; line-height: 1.7; }
.fig { margin: 0; display: grid; gap: 10px; align-content: start; min-width: 0; }
.fig button { all: unset; cursor: zoom-in; display: block; background: var(--plate); }
.fig button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.fig img { width: 100%; }
.fig figcaption { font-size: var(--step--1); color: var(--muted); max-width: 52ch; }
.b-full { grid-column: 1 / -1; }
.b-medium { grid-column: 3 / span 8; }
.b-pair, .b-trio, .b-quad { grid-column: 1 / -1; display: grid; gap: clamp(12px, 2vw, 28px); align-items: start; }
.b-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.b-pair.b-center { grid-column: 3 / span 8; }
.b-trio { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.b-quad { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.b-eq { grid-column: 1 / -1; display: flex; gap: clamp(12px, 2vw, 28px); align-items: flex-start; }
.eq-item { min-width: 0; }
.eq-item.stack { display: flex; flex-direction: column; gap: clamp(12px, 2vw, 28px); }
/* Fill rows: the single image stretches to the exact height of the stacked column beside it,
   trimming a little of its own white margin so the two sides end on the same line. */
.b-eq.fill { align-items: stretch; }
.b-eq.fill > .eq-item:not(.stack) { display: flex; }
.b-eq.fill > .eq-item:not(.stack) > .fig { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.b-eq.fill > .eq-item:not(.stack) > .fig > button { flex: 1; position: relative; min-height: 0; background: #fff; }
.b-eq.fill > .eq-item:not(.stack) > .fig > button img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.b-split { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: clamp(12px, 2vw, 28px); row-gap: 28px; align-items: center; }
.b-split .fig { grid-column: 1 / span 6; }
.b-split .b-text { grid-column: 8 / span 5; }

.p-nav { margin-top: clamp(56px, 8vw, 104px); padding-top: 24px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.p-nav a { text-decoration: none; display: grid; gap: 2px; }
.p-nav a span { font-size: var(--step--1); color: var(--muted); }
.p-nav a strong { font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; }
.p-nav a:last-child { text-align: right; margin-left: auto; }

/* Gallery pages */
.g-head { display: grid; gap: 18px; margin-bottom: clamp(40px, 6vw, 72px); }
.g-head h1 { font-size: var(--step-3); letter-spacing: 0.06em; text-transform: uppercase; }
.g-rows { --g-gap: clamp(12px, 2vw, 28px); display: grid; gap: var(--g-gap); }
.g-row { display: flex; justify-content: center; gap: var(--g-gap); }
.g-item { all: unset; cursor: zoom-in; display: block; flex: none; min-width: 0; }
.g-item img { width: 100%; height: auto; display: block; }
.g-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Lightbox */
.lightbox {
  position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--paper) 96%, transparent);
  display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px;
  padding: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  cursor: zoom-out;
}
.lightbox img { width: 100%; height: 100%; object-fit: contain; }
.lightbox p { text-align: center; color: var(--muted); font-size: var(--step--1); }
.lb-close {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font: inherit; font-size: var(--step--1); background: none; border: 1px solid var(--rule); color: var(--ink); padding: 4px 12px; cursor: pointer;
}

/* Project pages are shown at 80% scale on larger screens (like zooming the browser out to 80%).
   The header, footer and home page stay at full size; phones and tablets are unchanged. */
@media (min-width: 861px) {
  .project { zoom: 0.8; }
}
@media (max-width: 860px) {
  .b-pair.b-center { grid-column: 1 / -1; }
  .hero-text, .hero-figure, .bio, .cv, .p-title, .titleblock, .b-text, .b-medium { grid-column: 1 / -1; }
  .hero-figure { order: -1; }
  .projects { display: flex; flex-direction: column; gap: 48px; }
  .proj-col { display: contents; }
  .other-item { grid-column: span 6; }
  .b-split .fig, .b-split .b-text { grid-column: 1 / -1; }
  .b-quad { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .b-trio { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .b-trio .fig:last-child:nth-child(odd) { grid-column: 1 / -1; }
}
@media (max-width: 520px) {
  .g-row { flex-direction: column; }
  .g-item { width: 100% !important; }
  .b-eq { flex-direction: column; }
  .b-eq .eq-item { flex: none !important; width: 100%; }
  .b-eq.fill > .eq-item:not(.stack) > .fig > button { position: static; }
  .b-eq.fill > .eq-item:not(.stack) > .fig > button img { position: static; height: auto; }
  .b-pair, .b-trio { grid-template-columns: minmax(0, 1fr); }
  .b-trio .fig:last-child:nth-child(odd) { grid-column: auto; }
  .cv-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <a class="wordmark" href="#">Brandon Nguyen</a>
    <nav aria-label="Main">
      <a href="#architecture" data-nav="architecture">Architecture</a>
      <a href="#design" data-nav="design">Design &amp; Art</a>
      <a href="#about" data-nav="about">About</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span>&copy; 2026 Brandon Nguyen</span>

  </div>
</footer>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-close" id="lb-close" type="button">Close</button>

</div>

function projectView(p) {
  const i = PROJECTS.indexOf(p);
  const prev = PROJECTS[(i - 1 + PROJECTS.length) % PROJECTS.length];
  const next = PROJECTS[(i + 1) % PROJECTS.length];
  const f = p.facts;
  const cell = (k, v, wide) => `<div class="tb-cell${wide ? " wide" : ""}"><span class="tb-label">${esc(k)}</span><span class="tb-value">${esc(v)}</span></div>`;
  const instrKey = f.Instructors ? "Instructors" : "Instructor";
  // Media spans the full width; the rest pair up, with course and instructor side by side on the bottom row.
  const half = [cell("Term", f.Term), cell("Type", f.Type)];
  if (f.Site && f.Site !== "None") half.push(cell("Site", f.Site), `<div class="tb-cell" aria-hidden="true"></div>`);
  half.push(cell("Course", f.Course), cell(instrKey, f[instrKey]));
  const cells = [cell("Media", f.Media, true), ...half];

  const blocks = p.blocks.map((b, n) => {
    if (b.text) return textBlock(b.text);
    if (b.full) return `<div class="b-full">${fig(b.full, "100vw", n === 0)}</div>`;
    if (b.medium) return `<div class="b-medium">${fig(b.medium, "(max-width: 860px) 100vw, 66vw")}</div>`;
    if (b.pair) return `<div class="b-pair">${b.pair.map(f => fig(f, "(max-width: 520px) 100vw, 50vw")).join("")}</div>`;
    if (b.cpair) return `<div class="b-pair b-center">${b.cpair.map(f => fig(f, "(max-width: 520px) 100vw, 34vw")).join("")}</div>`;
    if (b.trio) return `<div class="b-trio">${b.trio.map(f => fig(f, "(max-width: 520px) 100vw, 33vw")).join("")}</div>`;
    if (b.quad) return `<div class="b-quad">${b.quad.map(f => fig(f, "(max-width: 860px) 50vw, 25vw")).join("")}</div>`;
    if (b.row) {
      // A row item is either one figure or a column of figures stacked on top of each other.
      const isStack = it => Array.isArray(it[0]);
      const ratio = it => isStack(it) ? 1 / it.reduce((t, f) => t + 1 / (DIMS[f[0]] || 1), 0) : (DIMS[it[0]] || 1);
      const total = b.row.reduce((t, it) => t + ratio(it), 0);
      return `<div class="b-eq${b.fill ? " fill" : ""}">${b.row.map(it => {
        const r = ratio(it), sizes = `(max-width: 520px) 100vw, ${Math.ceil(100 * r / total)}vw`;
        const inner = isStack(it) ? it.map(f => fig(f, sizes)).join("") : fig(it, sizes);
        return `<div class="eq-item${isStack(it) ? " stack" : ""}" style="flex: ${r} 1 0">${inner}</div>`;
      }).join("")}</div>`;
    }
    if (b.split) return `<div class="b-split">${fig(b.split[0], "(max-width: 860px) 100vw, 50vw", n === 0)}${textBlock(b.split[1])}</div>`;
    return "";
  }).join("");

  return `
  <article class="wrap project">
    <a class="back" href="#architecture">&larr; All projects</a>
    <header class="grid p-head">
      <div class="p-title">
        <span class="p-num">${pad(i + 1)}</span>
        <h1>${esc(p.title)}</h1>
        <p class="p-intro">${esc(p.intro)}</p>
      </div>
      <div class="titleblock" aria-label="Project information">${cells.join("")}</div>
    </header>
    <div class="grid blocks">${blocks}</div>
    <nav class="p-nav" aria-label="More projects">
      <a href="#${prev.slug}"><span>Previous</span><strong>${esc(prev.title)}</strong></a>
      <a href="#${next.slug}"><span>Next</span><strong>${esc(next.title)}</strong></a>
    </nav>
  </article>`;
}

function galleryView(g) {
  const rowSum = r => r.reduce((t, [n]) => t + (DIMS[n] || 1), 0);
  const allMax = Math.max(...g.rows.map(rowSum));
  const allCount = Math.max(...g.rows.map(r => r.length));
  // fill: every row spans the full width; otherwise all rows share one height and shorter rows are centered.
  const rows = g.rows.map(r => { const maxSum = g.fill ? rowSum(r) : allMax, maxCount = g.fill ? r.length : allCount; return `<div class="g-row">${r.map(([n, alt]) => {
    const w = `calc((100% - ${maxCount - 1} * var(--g-gap)) * ${(DIMS[n] || 1) / maxSum})`;
    return `<button type="button" class="g-item" style="width: ${w}" data-full="img/${n}.jpg${VER[n] ? `?v=${VER[n]}` : ""}" data-cap="" aria-label="Enlarge: ${esc(alt)}">${img(n, alt, "(max-width: 520px) 100vw, 25vw")}</button>`;
  }).join("")}</div>`; }).join("");
  return `
  <article class="wrap project gallery">
    <a class="back" href="#design">&larr; Design &amp; Art</a>
    <header class="g-head">
      <h1>${esc(g.title)}</h1>
      <p class="p-intro">${esc(g.intro)}</p>
    </header>
    <div class="g-rows">${rows}</div>
  </article>`;
}

/* ---------- Routing (plain #name hashes) ---------- */
let current = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const proj = PROJECTS.find(x => x.slug === h);
  const gal = GALLERIES.find(x => x.slug === h);
  const p = proj || gal;
  const view = proj ? "p:" + proj.slug : gal ? "g:" + gal.slug : "home";
  if (view !== current) {
    app.innerHTML = proj ? projectView(proj) : gal ? galleryView(gal) : homeView();
    document.title = p ? `${p.title} | Brandon Nguyen` : "Brandon Nguyen";
    current = view;
    bindCopy();
  }
  document.querySelectorAll("[data-nav]").forEach(a => a.setAttribute("aria-current", String(gal ? a.dataset.nav === "design" : !p && a.dataset.nav === h)));
  if (p) { window.scrollTo(0, 0); return; }
  const target = h && document.getElementById(h);
  if (target) {
    const offset = document.querySelector(".mast").offsetHeight;
    window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - offset + 1 });
  } else if (!h) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();

/* ---------- Copy email ---------- */
function bindCopy() {
  document.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", () => {
      const text = btn.dataset.copy;
      const done = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1600); };
      const fallback = () => {
        const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected";
      };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    });
  });
}

/* ---------- Lightbox ---------- */
const lb = document.getElementById("lightbox"), lbImg = document.getElementById("lb-img"), lbCap = document.getElementById("lb-cap");
let lastFocus = null;
app.addEventListener("click", e => {
  const b = e.target.closest("button[data-full]");
  if (!b) return;
  lastFocus = b;
  lbImg.src = b.dataset.full; lbImg.alt = b.dataset.cap || (b.getAttribute("aria-label") || "").replace("Enlarge: ", ""); lbCap.textContent = b.dataset.cap;
  lb.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("lb-close").focus();
});
function closeLb() { lb.hidden = true; lbImg.removeAttribute("src"); document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); }
lb.addEventListener("click", closeLb);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !lb.hidden) closeLb(); });
</script>
</body>
